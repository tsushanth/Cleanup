AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cleanup App - Cloud Archive Backend

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ARCHIVE_BUCKET: !Ref ArchiveBucket
        USERS_TABLE: !Ref UsersTable
        ITEMS_TABLE: !Ref ItemsTable

Resources:
  # S3 Bucket for archived files
  ArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cleanup-archive-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: CleanupIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # DynamoDB Table for user records
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: archive-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # DynamoDB Table for archived items
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: archive-items
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE

  # Cognito Identity Pool
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: cleanup-archive-identity-pool
      AllowUnauthenticatedIdentities: false
      SupportedLoginProviders:
        appleid.apple.com: com.kreativekoala.cleanup

  # IAM Role for authenticated Cognito users
  CognitoAuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: CognitoAuthPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - execute-api:Invoke
                Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cleanup-archive-*

  # Attach role to identity pool
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthRole.Arn

  # API Gateway with IAM auth (Cognito Identity Pool users sign requests with temp AWS creds)
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Auth:
        DefaultAuthorizer: AWS_IAM
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # Lambda Functions
  AuthRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/archive-auth-register.handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/register
            Method: POST
            RestApiId: !Ref Api
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  UploadPresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/archive-upload-presign.handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /upload/presign
            Method: POST
            RestApiId: !Ref Api
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - S3CrudPolicy:
            BucketName: !Ref ArchiveBucket

  UploadCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/archive-upload-complete.handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /upload/complete
            Method: POST
            RestApiId: !Ref Api
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  ItemsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/archive-items-list.handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /items
            Method: GET
            RestApiId: !Ref Api
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ItemsTable

  ItemDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/archive-item-delete.handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /items/{itemId}
            Method: DELETE
            RestApiId: !Ref Api
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - S3CrudPolicy:
            BucketName: !Ref ArchiveBucket

  DownloadInitiateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/archive-download-initiate.handler
      Timeout: 60
      Events:
        Api:
          Type: Api
          Properties:
            Path: /download/initiate
            Method: POST
            RestApiId: !Ref Api
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - S3CrudPolicy:
            BucketName: !Ref ArchiveBucket
        - Statement:
            - Effect: Allow
              Action:
                - s3:RestoreObject
              Resource: !Sub arn:aws:s3:::${ArchiveBucket}/*

  QuotaGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/archive-quota-get.handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /quota
            Method: GET
            RestApiId: !Ref Api
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ItemsTable

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1
  IdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref IdentityPool
  ArchiveBucket:
    Description: S3 Bucket for archives
    Value: !Ref ArchiveBucket
